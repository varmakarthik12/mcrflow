# Air configuration for MCRFlow Control Plane (Live Reload)
root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./bin/mcrflow-control ./cmd/mcrflow-control"
  bin = "./bin/mcrflow-control"
  entrypoint = "./bin/mcrflow-control"
  delay = 500
  exclude_dir = ["assets", "tmp", "vendor", "testdata", "bin", "docs", "data", "web/node_modules", "node_modules", ".git", "media"]
  exclude_file = []
  exclude_regex = ["_test\\.go$"]
  exclude_unchanged = false
  follow_symlink = false
  full_bin = ""
  include_dir = ["cmd/mcrflow-control", "internal"]
  include_ext = ["go"]
  include_file = []
  args_bin = ["-port", "3081"]
  kill_delay = "0s"
  log = "build-errors.log"
  poll = false
  poll_interval = 0
  rerun = false
  rerun_delay = 500
  send_interrupt = false
  stop_on_error = true

[build.windows]
  cmd = "go build -o ./bin/mcrflow-control.exe ./cmd/mcrflow-control"
  bin = "./bin/mcrflow-control.exe"
  entrypoint = "./bin/mcrflow-control.exe"
  args_bin = ["-port", "3081"]

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  time = false

[misc]
  clean_on_exit = true

[screen]
  clear_on_rebuild = false
  keep_scroll = true
