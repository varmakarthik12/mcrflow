[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:omnistream-control]
command=/usr/local/bin/omnistream-control --config /etc/omnistream/control.yaml
autostart=true
autorestart=true
stderr_logfile=/var/log/omnistream-control.err.log
stdout_logfile=/var/log/omnistream-control.out.log
priority=10

[program:playout-agent]
command=/usr/local/bin/playout-agent --config /etc/omnistream/agent.yaml
autostart=true
autorestart=true
stderr_logfile=/var/log/playout-agent.err.log
stdout_logfile=/var/log/playout-agent.out.log
priority=20
