[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:mcrflow-control]
command=/usr/local/bin/mcrflow-control --config /etc/mcrflow/control.yaml
autostart=true
autorestart=true
stderr_logfile=/var/log/mcrflow-control.err.log
stdout_logfile=/var/log/mcrflow-control.out.log
priority=10

[program:mcrflow-agent]
command=/usr/local/bin/mcrflow-agent --config /etc/mcrflow/agent.yaml
autostart=true
autorestart=true
stderr_logfile=/var/log/mcrflow-agent.err.log
stdout_logfile=/var/log/mcrflow-agent.out.log
priority=20
