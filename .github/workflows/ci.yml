name: MCRFlow CI & Merge Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test & Verify Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Install FFmpeg (Media Probing Runtime)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Verify Go Dependencies
        run: go mod download

      - name: Run Go Unit & E2E Integration Tests
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Compile MCRFlow Control Plane Binary
        run: go build -v -o bin/mcrflow-control ./cmd/mcrflow-control

      - name: Compile MCRFlow Edge Playout Agent Binary
        run: go build -v -o bin/mcrflow-agent ./cmd/mcrflow-agent

      - name: Verify Static UI Assets
        run: |
          test -f ui-mockup/index.html || exit 1
          echo "Static UI assets verified successfully"

  lint:
    name: Code Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Run Go Vet
        run: go vet ./...
